name: Playwright tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Fork PRs cannot read secrets and must not run against the shared demo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      PW_Headless: true
      PW_OrangeHrmBaseUrl: https://opensource-demo.orangehrmlive.com/
      PW_Username: ${{ secrets.PW_USERNAME }}
      PW_Password: ${{ secrets.PW_PASSWORD }}
    steps:
      - name: Require credential secrets
        run: |
          if [ -z "$PW_Username" ] || [ -z "$PW_Password" ]; then
            echo "::error::PW_USERNAME and PW_PASSWORD repository secrets must be configured (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-restore --settings .runsettings --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
