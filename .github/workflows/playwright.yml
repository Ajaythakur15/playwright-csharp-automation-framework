name: Playwright tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Fork PRs cannot read secrets and must not run against the shared demo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      PW_Headless: true
      PW_OrangeHrmBaseUrl: https://opensource-demo.orangehrmlive.com/
    steps:
      - uses: actions/checkout@v4
      # Only override the appsettings credentials when the repo secrets are configured;
      # an empty env var would otherwise replace them with blanks.
      - name: Apply credential secrets
        env:
          PW_USERNAME: ${{ secrets.PW_USERNAME }}
          PW_PASSWORD: ${{ secrets.PW_PASSWORD }}
        run: |
          if [ -n "$PW_USERNAME" ]; then echo "PW_Username=$PW_USERNAME" >> "$GITHUB_ENV"; fi
          if [ -n "$PW_PASSWORD" ]; then echo "::add-mask::$PW_PASSWORD"; echo "PW_Password=$PW_PASSWORD" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-restore --settings .runsettings --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
