name: Playwright tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PW_Headless: true
      PW_OrangeHrmBaseUrl: https://opensource-demo.orangehrmlive.com/
      # Fall back to the public demo credentials when the repo secrets are not configured.
      PW_Username: ${{ secrets.PW_USERNAME || 'Admin' }}
      PW_Password: ${{ secrets.PW_PASSWORD || 'admin123' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-restore --settings .runsettings --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
